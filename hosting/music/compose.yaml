# Based on https://docs.invidious.io/installation/#docker-compose-method-production
# Run through Start Music Service.cmd, which generates the private secrets file.
services:
  invidious:
    image: quay.io/invidious/invidious:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      invidious-db:
        condition: service_healthy
      companion:
        condition: service_started
    environment:
      INVIDIOUS_CONFIG: |
        db:
          dbname: invidious
          user: kemal
          password: ${MUSIC_DB_PASSWORD:?Run the music launcher first}
          host: invidious-db
          port: 5432
        check_tables: true
        domain: 127.0.0.1
        external_port: 3001
        https_only: false
        statistics_enabled: true
        registration_enabled: false
        login_enabled: false
        invidious_companion:
          - private_url: http://companion:8282/companion
        invidious_companion_key: ${MUSIC_COMPANION_KEY:?Run the music launcher first}
        hmac_key: ${MUSIC_HMAC_KEY:?Run the music launcher first}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://127.0.0.1:3000/api/v1/stats || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  companion:
    image: quay.io/invidious/invidious-companion:latest
    restart: unless-stopped
    environment:
      SERVER_SECRET_KEY: ${MUSIC_COMPANION_KEY:?Run the music launcher first}
    cap_drop: [ALL]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    volumes:
      - companioncache:/var/tmp/youtubei.js:rw
    logging:
      options:
        max-size: "10m"
        max-file: "3"
  invidious-db:
    image: docker.io/library/postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_DB: invidious
      POSTGRES_USER: kemal
      POSTGRES_PASSWORD: ${MUSIC_DB_PASSWORD:?Run the music launcher first}
    volumes:
      - postgresdata:/var/lib/postgresql/data
      - ./.music/invidious-source/config/sql:/config/sql:ro
      - ./.music/invidious-source/docker/init-invidious-db.sh:/docker-entrypoint-initdb.d/init-invidious-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  postgresdata:
  companioncache:
